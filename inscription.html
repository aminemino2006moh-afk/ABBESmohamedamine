    <main>
    <div class="register-container">
        <h2>Créer un compte</h2>
        <form id="signup-form" action="/register" method="POST">
          <div class="input-group">
        <label for="nom">Nom</label>
        <input type="text" id="nom" name="nom" required> 
    </div>
            <div class="input-group">
        <label for="prenom">Prenom</label>
        <input type="text" id="prenom" name="prenom" required> 
    </div>
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="input-group">
                <label for="phone">Entrez voter numéro téléphone</label>
                <input type="tel" id="phone" name="phone" required>
            </div>
            <div class="input-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="input-group">
                <label for="confirm-password">Confirmer le Mot de passe</label>
                <input type="password" id="confirm-password" name="confirm-password" required>
            </div>
            <button type="submit">Créer</button>
        </form>
        <p class="login-link">Ou</p>
        <p class="login-link">Avez-vous déja un compte?<a href="connexion.html">Se connecter</a></p>
        
    </div>
