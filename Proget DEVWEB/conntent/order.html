<main>
<form action="/submit-order" method="POST">

<div class="container">
<h2>Command ou nouvaux reservation</h2>
     
<div class="input-group">
  <label for="username">Nom</label>
  <input type="text" id="username" name="username" required>               
</div>   

<div class="input-group">
  <label for="lastname">Prenom</label>
  <input type="text" id="lastname" name="lastname" required>
</div>  

<div class="input-group">  
   <label for="email">Email</label>         
   <input type="email" id="email" name="email" required> 
</div>

<div class="input-group">        
   <label for="phone">Entrez voter numéro téléphone</label>
   <input type="tel" id="phone" name="phone" required>
</div>

<div class="input-group"> 
   <label for="phone2">Entrez voter numéro téléphone2</label>
   <input type="tel" id="phone2" name="phone2" required>
</div>

<div class="input-group"> 
   <label for="type">:Type de livriason</label>
        <select id="type" name="type" required>
            <option value="">Choisissez votre mode de livraison</option>
            <option value="commande">livriason á domicille</option>
            <option value="reservation">Au bureau</option>
        </select>
</div>

<div class="input-group"> 
        <label for="details">:Details</label>
        <textarea id="details" name="details" rows="4"></textarea>
</div>

<div class="input-group"> 
  <label for="type1">:Á</label>
        <select id="type1" name="type" required>
            <option value="">Selectionnez une ville</option>
            <option value="To">Tizi ouzou</option>
            <option value="Dbk">Dràa Bn khedda</option>
            <option value="Dem">Dràa El mizan</option> 
            <option value="oud">Ouadhia</option>
            <option value="ous">Ouacif</option>
            <option value="Tig">Tigzirt</option>
            <option value="TGH">Tizi Ghenif</option>
            <option value="Az">Azeffoun</option>
            <option value="TAz">Azazga</option>
            <option value="Bgh">Boughni</option>
        </select>
</div> 


<div class="cards-container">
     <div class="card" onclick="selectOption('command', this)">
        <h3>Command</h3>
     </div>
     <div class="card" onclick="selectOption('reservation', this)">
        <h3>Reservation </h3>       
     </div>
</div>
<input type="hidden" id="selectedType" name="type">

    <button type="submit">Valider la command</button></div>
 </form>

</main>

<script src="../javascript/order.js"></script>
